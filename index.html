<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Gemelo Digital</title>
<style>
body { font-family: Arial; background: #0f172a; color:white; margin:0; padding:20px; }
.row { display:flex; gap:10px; margin-bottom:20px; }
.card { background:#1e293b; padding:10px; border-radius:10px; flex:1; }
.bar { height:10px; background:#334155; border-radius:5px; }
.bar-inner { height:10px; border-radius:5px; }
.ok { background:limegreen; }
.warn { background:orange; }
.danger { background:red; }
canvas { background:#020617; border-radius:10px; }
#log { height:200px; overflow-y:auto; background:#020617; padding:10px; font-size:12px; }
button { padding:10px; margin-bottom:10px; cursor:pointer; }
</style>
</head>
<body>

<h2>Gemelo Digital Logístico</h2>
<button onclick="toggleSim()">Play / Pause</button>

<h3>Centros de Distribución</h3>
<div class="row" id="cds"></div>

<h3>Tienda</h3>
<div class="row" id="tiendaUI"></div>

<h3>Red Logística</h3>
<canvas id="network" width="900" height="420"></canvas>

<h3>Estaciones de Entrega</h3>
<div class="row" id="ees"></div>

<h3>Logs</h3>
<div id="log"></div>

<script>
// =====================
// MODELOS
// =====================
class CD {
  constructor(nombre, stock_seguridad, EOQ, lead_time, capacidad, ventaPromedioDiaria) {
    this.nombre = nombre;
    this.stock = stock_seguridad;
    this.Inv = EOQ;
    this.EOQ = EOQ;
    this.lead_time = lead_time;
    this.capacidad = capacidad;
    this.ventaPromedioDiaria = ventaPromedioDiaria;
    this.ROP = stock_seguridad + (ventaPromedioDiaria * lead_time);
    this.pendiente = false;
  }
}

class Tienda {
  constructor(nombre, stock_seguridad, EOQ, lead_time, capacidad, ventaPromedioDiaria) {
    this.nombre = nombre;
    this.stock = stock_seguridad;
    this.Inv = EOQ;
    this.EOQ = EOQ;
    this.lead_time = lead_time;
    this.capacidad = capacidad;
    this.ventaPromedioDiaria = ventaPromedioDiaria;
    this.ROP = stock_seguridad + (ventaPromedioDiaria * lead_time);
    this.pendiente = false;
  }
}

class CC { constructor(nombre) { this.nombre = nombre; } }

class EE {
  constructor(nombre, demanda, capacidad) {
    this.nombre = nombre; this.demanda = demanda; this.capacidad = capacidad;
  }
}

// =====================
// DATA
// constructor(nombre, stock_seguridad, EOQ, lead_time, capacidad, ventaPromedioDiaria)
// =====================
const cds = [
  new CD("CD1-Nuevo León",       123, 2000, 0.1,  4000,  500),
  new CD("CD2-Estado de México", 185, 1897, 0.1,  6000,  700),
  new CD("CD3-Baja California",  247, 3347, 0.1,  8000,  900),
  new CD("CD4-Yucatán",          308, 2309, 0.1, 10000, 1100),
  new CD("CD5-Jalisco",          339, 2225, 0.1, 11000, 1200)
];

const tienda = new Tienda("Tienda Central", 50, 500, 0.05, 1000, 200);

const ccs = [
  new CC("CC1-Estado de México"),
  new CC("CC2-Queretaro"),
  new CC("CC3-Monterrey")
];

const ees = [
  new EE("EE1",  7000,  8400),
  new EE("EE2",  8000,  9600),
  new EE("EE3",  9000, 10800),
  new EE("EE4", 10000, 12000),
  new EE("EE5", 11000, 13200)
];

let hora = 0;
let running = false;
let despachando = false;

// =====================
// POSICIONES
// Canvas ahora es 900x420 para dar espacio al nodo tienda
// =====================
const pos = {
  proveedor: { x: 50, y: 150 },
  tienda:    { x: 50, y: 330 },
  cds: cds.map((_,i) => ({ x: 180, y: 40 + i * 65 })),
  ccs: ccs.map((_,i) => ({ x: 480, y: 80 + i * 100 })),
  ees: ees.map((_,i) => ({ x: 820, y: 40 + i * 65 }))
};

// =====================
// UI
// =====================
function renderCard(nodo) {
  let cls = "ok", mensaje = "";
  if (nodo.Inv <= nodo.stock) {
    cls = "danger";
    mensaje = nodo.pendiente ? "Reposición en camino" : "Solicitando proveedor";
  } else if (nodo.Inv < nodo.ROP) {
    cls = "warn";
    mensaje = nodo.pendiente ? "Reposición en camino" : "Stock medio";
  }
  return `<div class="card">
    <b>${nodo.nombre}</b>
    <div>Inventario: ${Math.round(nodo.Inv)}</div>
    <div>ROP: ${Math.round(nodo.ROP)}</div>
    <div class="bar"><div class="bar-inner ${cls}" style="width:${Math.min(100, nodo.Inv/nodo.capacidad*100)}%"></div></div>
    <div style="font-size:11px;margin-top:5px;">${mensaje}</div>
  </div>`;
}

function render() {
  document.getElementById("cds").innerHTML = cds.map(renderCard).join("");
  document.getElementById("tiendaUI").innerHTML = renderCard(tienda);
  document.getElementById("ees").innerHTML = ees.map(ee =>
    `<div class="card"><b>${ee.nombre}</b><div>Demanda: ${ee.demanda}</div></div>`
  ).join("");
}

function log(msg) {
  const div = document.getElementById("log");
  div.innerHTML = `[H${hora}] ${msg}<br>` + div.innerHTML;
}

// =====================
// CANVAS
// =====================
const canvas = document.getElementById("network");
const ctx = canvas.getContext("2d");

function drawBase() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.font = "11px Arial";
  drawNode(pos.proveedor, "white",  "PROV");
  drawNode(pos.tienda,    "#a78bfa", tienda.nombre);
  cds.forEach((cd, i) => drawNode(pos.cds[i], "cyan",   cd.nombre));
  ccs.forEach((cc, i) => drawNode(pos.ccs[i], "yellow", cc.nombre));
  ees.forEach((ee, i) => drawNode(pos.ees[i], "orange", ee.nombre));
}

function drawNode(p, color, text) {
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(p.x, p.y, 10, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = "white";
  ctx.fillText(text, p.x - 20, p.y - 15);
}

// =====================
// ANIMACIÓN DE DESPACHO — bloquea loop
// =====================
function animateDespacho(points, color, callback) {
  despachando = true;
  let segment = 0, t = 0;

  function frame() {
    drawBase();
    ctx.strokeStyle = color || "lime";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(points[0].x, points[0].y);
    for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
    ctx.stroke();
    ctx.lineWidth = 1;

    const p1 = points[segment], p2 = points[segment+1];
    const x = p1.x + (p2.x - p1.x) * t;
    const y = p1.y + (p2.y - p1.y) * t;
    ctx.fillStyle = "white";
    ctx.beginPath(); ctx.arc(x, y, 6, 0, Math.PI*2); ctx.fill();

    t += 0.05;
    if (t >= 1) {
      t = 0; segment++;
      if (segment >= points.length - 1) {
        despachando = false;
        if (callback) callback();
        return;
      }
    }
    requestAnimationFrame(frame);
  }
  frame();
}

// =====================
// ANIMACIÓN DE PROVEEDOR — NO bloquea loop
// =====================
function animateProveedor(destPos) {
  const p1 = pos.proveedor;
  const p2 = destPos;
  let t = 0;
  function frame() {
    const x = p1.x + (p2.x - p1.x) * t;
    const y = p1.y + (p2.y - p1.y) * t;
    ctx.fillStyle = "magenta";
    ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI*2); ctx.fill();
    t += 0.03;
    if (t < 1) requestAnimationFrame(frame);
  }
  frame();
}

// =====================
// REPOSICIÓN GENÉRICA — sirve para CD y Tienda
// =====================
function solicitarReposicion(nodo, destPos, leadTimeMs) {
  if (nodo.pendiente) return;
  nodo.pendiente = true;
  log(`Proveedor → ${nodo.nombre} (EOQ: ${nodo.EOQ})`);
  animateProveedor(destPos);
  setTimeout(() => {
    nodo.Inv += nodo.EOQ;
    nodo.pendiente = false;
    log(`Reposición llegó a ${nodo.nombre} +${nodo.EOQ}`);
    render();
  }, leadTimeMs);
}

// =====================
// HELPER — elegir CD con stock suficiente
// =====================
function elegirCD(cantidad) {
  const disponibles = cds
    .map((cd, i) => ({ cd, i }))
    .filter(({ cd }) => cd.Inv >= cantidad);
  if (!disponibles.length) return null;
  return disponibles[Math.floor(Math.random() * disponibles.length)];
}

// =====================
// SIMULACIÓN
// =====================
function step() {
  hora++;

  // --- Revisar reposiciones de todos los CDs ---
  cds.forEach((cd, i) => {
    if (cd.Inv <= cd.ROP && !cd.pendiente)
      solicitarReposicion(cd, pos.cds[i], 72000); // lead time 3 días
  });

  // --- Revisar reposición de la Tienda ---
  if (tienda.Inv <= tienda.ROP && !tienda.pendiente)
    solicitarReposicion(tienda, pos.tienda, 36000); // lead time ~1.5 días (más corto)

  // --- Paso 1: ¿Venta en Tienda o despacho hacia EE? ---
  const esVentaTienda = Math.random() > 0.7; // 30% ventas en tienda, 70% despacho a EE

 if (esVentaTienda) {

  const esEnvioEE = Math.random() > 0.5; // 50% probabilidad

  if (!esEnvioEE) {
    // VENTA NORMAL EN TIENDA
    const cantidad = Math.floor(tienda.ventaPromedioDiaria / 5 * (0.8 + Math.random() * 0.4));

    if (tienda.Inv < cantidad) {
      log(`Tienda sin stock suficiente (${Math.round(tienda.Inv)} < ${cantidad})`);
      return;
    }

    tienda.Inv -= cantidad;
    log(`Venta tienda: ${tienda.nombre} → Cliente : ${cantidad}`);

    ctx.fillStyle = "rgba(167,139,250,0.5)";
    ctx.beginPath();
    ctx.arc(pos.tienda.x, pos.tienda.y, 20, 0, Math.PI*2);
    ctx.fill();

    render();
    return;

  } else {
    // TIENDA → EE
    const iEE = Math.floor(Math.random() * ees.length);
    const ee  = ees[iEE];

    let cantidad = Math.round(tienda.ventaPromedioDiaria / 5 * (0.8 + Math.random() * 0.4));
    cantidad = Math.min(cantidad, ee.demanda);
    cantidad = Math.min(cantidad, tienda.Inv);

    if (cantidad <= 0) {
      log(` ${ee.nombre} sin demanda o tienda sin stock`);
      return;
    }

    tienda.Inv -= cantidad;
    ee.demanda -= cantidad;

    log(`${tienda.nombre} → ${ee.nombre} : ${cantidad}`);

    animateDespacho([pos.tienda, pos.ees[iEE]], "#a78bfa");

    render();
    return;
  }
}

  // --- DESPACHO HACIA EE ---
  const iEE = Math.floor(Math.random() * ees.length);
  const ee  = ees[iEE];

  // Elegir CD primero para usar su ventaPromedioDiaria/5 como cantidad base
  // Se elige un CD válido; si no hay ninguno, se aborta
  // Intentamos con una cantidad estimada pequeña para elegir CD y luego usamos su VPD
  const cdCandidatos = cds
    .map((cd, i) => ({ cd, i }))
    .filter(({ cd }) => cd.Inv > 0);

  if (!cdCandidatos.length) {
    log(`Todos los CDs sin inventario`);
    return;
  }

  const { cd: cdElegido, i: iCD } = cdCandidatos[Math.floor(Math.random() * cdCandidatos.length)];

  // Cantidad basada en venta promedio diaria del CD elegido / 5
  let cantidad = Math.round(cdElegido.ventaPromedioDiaria / 5 * (0.8 + Math.random() * 0.4));
  cantidad = Math.min(cantidad, ee.demanda);
  cantidad = Math.min(cantidad, cdElegido.Inv);

  if (cantidad <= 0) {
    log(`${ee.nombre} sin demanda o ${cdElegido.nombre} sin stock`);
    return;
  }

  const usarCC = Math.random() > 0.5;

  cdElegido.Inv -= cantidad;
  ee.demanda    -= cantidad;

  if (usarCC) {
    const iCC = Math.floor(Math.random() * ccs.length);
    log(`${cdElegido.nombre} → ${ccs[iCC].nombre} → ${ee.nombre} : ${cantidad}`);
    animateDespacho([pos.cds[iCD], pos.ccs[iCC], pos.ees[iEE]], "lime");
  } else {
    log(`${cdElegido.nombre} → ${ee.nombre} : ${cantidad}`);
    animateDespacho([pos.cds[iCD], pos.ees[iEE]], "lime");
  }

  render();
}

// =====================
// LOOP
// =====================
function loop() {
  if (running && !despachando) step();
  setTimeout(loop, 1000);
}

function toggleSim() { running = !running; }

render();
drawBase();
loop();
</script>
</body>
</html>
